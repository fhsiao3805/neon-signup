name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    # A Postgres of the job's own, thrown away when the job ends. The tests
    # use only this database; no Neon credentials are available to the job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signup
          POSTGRES_PASSWORD: signup
          POSTGRES_DB: signup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signup -d signup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://signup:signup@localhost:5432/signup_test
      # app.py refuses to start without these; the values only matter here.
      DATABASE_URL: postgresql://signup:signup@localhost:5432/signup_test
      SECRET_KEY: ci-only-not-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python smoke_test.py

  deploy:
    # Only for a push to main (never for pull requests), and only once the
    # smoke test has passed.
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running deploy.
    concurrency:
      group: deploy-signup-deployment-123
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/setup-gcloud@v2

      # The key goes to the runner's temp folder, outside the checkout, so
      # `--source .` cannot upload it and it can never end up in the
      # repository. It is passed through an environment variable, never
      # pasted into the script, and deleted when the job ends.
      - name: Sign in to Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "::error::The GCP_CREDENTIALS secret is not set for this repository."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/gcp-key.json"
          ( umask 077; printf '%s' "$GCP_CREDENTIALS" > "$KEY_FILE" )
          gcloud auth activate-service-account --key-file="$KEY_FILE" --quiet
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy signup-deployment-123 --source .
          --project signup-deployment-123 --region us-west1
          --allow-unauthenticated --quiet

      - name: Remove key
        if: always()
        run: rm -f "${KEY_FILE:-$RUNNER_TEMP/gcp-key.json}"
